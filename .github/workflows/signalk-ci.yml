name: SignalK Plugin CI

on:
  push:
  pull_request:

jobs:
  test:
    # uses: SignalK/signalk-server/.github/workflows/plugin-ci.yml@master
    uses: jaffadog/signalk-server/.github/workflows/plugin-ci.yml@feat/separate-build-node-version
    with:
      build-command: 'npm run build:ui'
      format-check-command: 'npm run format:check'

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm test
# retest trigger: plugin-ci.yml schema-defaults activation + fail-on-warning verification
